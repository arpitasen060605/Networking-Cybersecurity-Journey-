<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}SOC Dashboard{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="layout">
        <div class="sidebar">
            <div class="logo">
                <div class="logo-icon">S</div>
                <div class="logo-text">SOC Dashboard</div>
            </div>
            <a href="/" class="nav-item">IP Reputation</a>
            <a href="/hash" class="nav-item">Hash Lookup</a>
            <a href="/url" class="nav-item">URL Checker</a>
            <a href="/whois" class="nav-item">WHOIS Lookup</a>
            <a href="/dns" class="nav-item">DNS Lookup</a>
            <a href="/cves" class="nav-item">Recent CVEs</a>
            <a href="/ioc" class="nav-item">IOC Manager</a>
        </div>

        <div class="main">
            {% block content %}{% endblock %}
        </div>
    </div>
</body>
</html>
